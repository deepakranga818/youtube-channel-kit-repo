<!doctype html>
<html><head><meta charset="utf-8">
<title>अदृश्य ब्रह्मांड का नक्शा</title>
<style>
@font-face{font-family:Jost;src:url(fonts/Jost.ttf) format('truetype');font-weight:100 900;}
@font-face{font-family:Deva;src:url(fonts/NotoSansDevanagari.ttf) format('truetype');font-weight:100 900;}
html,body{margin:0;background:#1D2052;overflow:hidden}
svg{display:block}
text{font-family:Jost,Deva,sans-serif}
</style></head>
<body>
<svg id="s" width="1920" height="1080" viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg"></svg>
<script src="flat.js"></script>
<script src="tara.js"></script>
<script src="film.js"></script>
<script>
window.render = function (t) {
  svg = document.getElementById('s'); svg.innerHTML = ''; uid = 0;
  defs = el('defs');
  film(t + FROM);
};
Promise.all([document.fonts.load('700 40px Jost'), document.fonts.load('500 40px Jost'), document.fonts.load('600 40px Deva', 'अदृश्य'), document.fonts.load('700 40px Deva', 'नक्शा')])
  .then(() => {
    window.DUR = TO - FROM;
    window.EV = filmEvents().filter(e => e.t >= FROM && e.t <= TO).map(e => ({ ...e, t: +(e.t - FROM).toFixed(4) }));
    window.TEXTS = t => { window.__TXT = []; window.render(t); const out = window.__TXT.filter(e => e.isConnected && e.textContent.trim()).map(e => { const r = e.getBoundingClientRect(); return { id: e.textContent, text: e.textContent, x0: r.left, y0: r.top, x1: r.right, y1: r.bottom }; }); window.__TXT = null; return out; };
    window.render(0); window.READY = true;
  });
</script>
</body></html>
